name: Debug date polyfill (fork only)
on:
  push:
    branches: [debug-date-polyfill]
defaults:
  run:
    shell: bash -e -l {0}
jobs:
  diagnose:
    runs-on: windows-2025-vs2026
    steps:
    - uses: actions/checkout@v4
    - uses: mamba-org/setup-micromamba@main
      with:
        environment-name: myenv
        environment-file: environment-dev.yml
        init-shell: bash
        cache-downloads: true
        create-args: |
          ninja
    - name: Pin howardhinnant_date below 3.0.4
      run: micromamba install -y -n myenv -c conda-forge "howardhinnant_date<3.0.4"
    - name: What conda installed
      run: |
        micromamba list | grep -iE 'date|tzdata'
        find "$CONDA_PREFIX/Library" -iname 'date*config*.cmake' -o -iname 'dateTargets*.cmake'
    - name: Configure, build and test as the date-polyfill ON / shared ON leg
      run: |
        cmake -S . -B build -A x64 -G "Visual Studio 18 2026" \
          -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX \
          -DBUILD_TESTS=ON -DSPARROW_CONTRACTS_THROW_ON_FAILURE=ON -DTRACK_COPIES=ON -DENABLE_INTEGRATION_TEST=ON \
          -DBUILD_EXAMPLES=ON -DCREATE_JSON_READER_TARGET=ON -DUSE_DATE_POLYFILL=ON \
          -DSPARROW_ENABLE_SIZE_CHECKS=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL \
          -DFETCH_DEPENDENCIES_WITH_CMAKE=MISSING -DSPARROW_BUILD_SHARED=ON 2>&1 | tee configure.log | grep -iE 'date'
        cd build
        cmake --build . --config Debug --target sparrow
        cmake --build . --config Debug --target test_sparrow_lib
        cmake --build . --config Debug --target run_tests_with_junit_report
